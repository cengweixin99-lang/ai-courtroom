global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: mootcourt-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: mootcourt-api

  # 双实例压测时可通过额外 target 覆盖此文件，将 api-2:8000 纳入同一 job。
  # 生产环境若启用 DIAGNOSTICS_API_KEY，应在监控网络入口注入 X-Diagnostics-Key。
