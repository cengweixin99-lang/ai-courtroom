[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mootcourt-api"
version = "0.1.0"
description = "Deterministic courtroom orchestration API for MootCourt Lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "aiomysql>=0.2,<1",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.4,<1",
  "elasticsearch[async]>=8.19,<9",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sse-starlette>=2.2,<3",
  "structlog>=25.1,<26",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "asgi-lifespan>=2.1,<3",
  "editables>=0.3,<1",
  "hatchling>=1.27,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1"
]

[project.scripts]
mootcourt-compare-legal-evals = "mootcourt.cli.compare_legal_evals:main"
mootcourt-eval-legal = "mootcourt.cli.eval_legal:main"
mootcourt-import-case = "mootcourt.cli.import_case:main"
mootcourt-index-legal = "mootcourt.cli.index_legal:main"
mootcourt-eval-m5 = "mootcourt.cli.eval_m5:main"
mootcourt-eval-qwen-agent = "mootcourt.cli.eval_qwen_agent:main"
mootcourt-eval-qwen-turn = "mootcourt.cli.eval_qwen_turn:main"
mootcourt-check-agent-provider = "mootcourt.cli.check_agent_provider:main"
mootcourt-accept-delivery = "mootcourt.cli.accept_delivery:main"
mootcourt-maintain-agent-data = "mootcourt.cli.maintain_agent_data:main"
mootcourt-load-provider-guard = "mootcourt.cli.load_provider_guard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mootcourt"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=mootcourt --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "PIE", "RUF", "SIM", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/mootcourt/cli/*.py" = ["T201"]

[tool.coverage.run]
branch = true
source = ["mootcourt"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mootcourt"]
