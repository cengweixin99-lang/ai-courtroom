name: agent-admission

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI-compatible Qwen model to evaluate
        required: false
        default: qwen3.7-plus
        type: string

permissions:
  contents: read

# 真实模型 Eval 有成本且会写入独立评测会话，避免同一分支并发重复执行。
concurrency:
  group: agent-admission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qwen-v5-admission:
    name: Qwen v5 real-model admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mootcourt
          MYSQL_USER: mootcourt
          MYSQL_PASSWORD: change-me
          MYSQL_ROOT_PASSWORD: change-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pchange-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: development
      DATABASE_URL: mysql+aiomysql://mootcourt:change-me@127.0.0.1:3306/mootcourt
      LLM_PROVIDER: openai-compatible
      LLM_MODEL: ${{ inputs.model || vars.QWEN_MODEL || 'qwen3.7-plus' }}
      LLM_API_KEY: ${{ secrets.QWEN_API_KEY }}
      LLM_BASE_URL: ${{ vars.QWEN_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_OUTPUT_TOKENS: "3000"
      LLM_MAX_INPUT_TOKENS: "24000"
      LLM_MAX_RETRIES: "2"
      LLM_MAX_INCOMPLETE_RETRIES: "1"
      LLM_RESPONSE_FORMAT: json_object
      LLM_MAX_TOKENS_FIELD: max_tokens
      LLM_ENABLE_THINKING: "false"
      LLM_TEMPERATURE: "0"
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Verify release secret
        shell: bash
        run: |
          test -n "$LLM_API_KEY" || {
            echo "::error::Repository secret QWEN_API_KEY is required for the real-model admission gate."
            exit 1
          }
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Prepare independent evaluation data
        working-directory: backend
        run: |
          alembic upgrade head
          mootcourt-import-case ../data/authoring/CASE-001
      - name: Run Qwen v5 admission gate
        working-directory: backend
        run: |
          python -m mootcourt.cli.eval_qwen_agent \
            ../evals/qwen_agent/cases.json \
            --redact-output \
            --output ../artifacts/qwen-agent-admission-summary.json
      - name: Upload redacted admission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-v5-admission-${{ github.run_id }}
          path: artifacts/qwen-agent-admission-summary.json
          if-no-files-found: warn
          retention-days: 90
