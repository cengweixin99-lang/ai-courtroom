name: backend

on:
  push:
    paths:
      - "backend/**"
      - "data/authoring/CASE-001/**"
      - "scripts/validate_case_package.py"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "data/authoring/CASE-001/**"
      - "scripts/validate_case_package.py"
      - ".github/workflows/backend.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mootcourt
          MYSQL_USER: mootcourt
          MYSQL_PASSWORD: change-me
          MYSQL_ROOT_PASSWORD: change-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pchange-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql+aiomysql://mootcourt:change-me@127.0.0.1:3306/mootcourt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Validate formatting and lint
        run: |
          ruff format --check backend/src backend/tests backend/migrations
          ruff check backend/src backend/tests backend/migrations scripts
      - name: Type check
        run: mypy --no-incremental backend/src backend/tests
      - name: Test with coverage
        run: pytest backend/tests --cov-report=term-missing --cov-report=xml
      - name: Validate authoring package
        run: python scripts/validate_case_package.py
      - name: Migrate MySQL and import CASE-001
        working-directory: backend
        run: |
          alembic upgrade head
          mootcourt-import-case ../data/authoring/CASE-001
          mootcourt-import-case ../data/authoring/CASE-001
